# Wöchentliche Update-PRs auf main (wie im Bestellportal MakerSpace und in der Goethe-Verwaltung)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript bleibt auf 5.x, 7.x bricht vite-plugin-dts (CLAUDE.md)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Hauptversionen von @nextcloud/vue folgen den Nextcloud-Versionen; die App gibt es nur für Nextcloud 32
      - dependency-name: "@nextcloud/vue"
        update-types: ["version-update:semver-major"]
  # Nur Testwerkzeuge (PHPUnit, sabre/vobject); die PHP-Version legt config.platform in composer.json fest
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    ignore:
      # sabre/vobject bringt Nextcloud selbst mit, die Tests sollen dieselbe Hauptversion nutzen
      - dependency-name: sabre/vobject
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
