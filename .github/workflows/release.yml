name: Release

# Bei einem Tag wie v0.1.0 wird das Paket calendar_planning-0.1.0.tar.gz gebaut und an einen Release-Entwurf gehängt,
# aber erst, wenn Version und CHANGELOG passen und die CI auf genau diesem Commit grün ist. Veröffentlichen tut Ralf.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Version prüfen
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          info="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)"
          test "$TAG" = "v$version" || { echo "::error title=Version::Tag $TAG passt nicht zu package.json ($version)"; exit 1; }
          test "$info" = "$version" || { echo "::error title=Version::appinfo/info.xml ($info) passt nicht zu package.json ($version)"; exit 1; }
          grep -q "^## \\[$version\\]" CHANGELOG.md || { echo "::error title=Version::CHANGELOG.md hat keinen Abschnitt ## [$version]"; exit 1; }

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  paket:
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Für die Build-Provenance (Sigstore-Attestierung des Pakets)
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: tools/paket.sh
      # Belegt, dass genau dieses Paket aus diesem Workflow-Lauf auf diesem Commit stammt.
      # Prüfen: gh attestation verify calendar_planning-<version>.tar.gz --repo RalfPfitzner/Calendar-extension-Nextcloud
      - name: Build-Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/calendar_planning-*.tar.gz
      - name: An Release-Entwurf hängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          datei="build/calendar_planning-${TAG#v}.tar.gz"
          summe="$(sha256sum "$datei" | cut -d' ' -f1)"
          {
            echo "Änderungen siehe CHANGELOG.md, Abschnitt ${TAG#v}."
            echo
            echo "SHA-256 \`$(basename "$datei")\`: \`$summe\`"
            echo
            echo "Herkunft prüfen: \`gh attestation verify $(basename "$datei") --repo $REPO\`"
          } > build/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$datei" --clobber
            gh release edit "$TAG" --notes-file build/release-notes.md
          else
            gh release create "$TAG" "$datei" --draft --title "$TAG" --notes-file build/release-notes.md
          fi
