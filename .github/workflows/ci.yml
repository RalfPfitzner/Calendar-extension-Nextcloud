name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Der Release-Workflow ruft die CI vor dem Bauen des Pakets auf
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: PHP-Version
        run: php -v
      - name: Composer-Cache-Verzeichnis
        id: composer
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer.outputs.dir }}
          key: composer-php-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress
      - name: Syntax
        run: composer lint
      - name: Unit-Tests
        run: composer test:unit

  # Passt die App zu den Schnittstellen jeder unterstützten Nextcloud-Version? (PHPStan gegen nextcloud/ocp
  # in genau dieser Version plus die genutzten Klassen aus apps/dav)
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        nextcloud: ['34.0.5', '35.0.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Composer-Cache-Verzeichnis
        id: composer
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer.outputs.dir }}
          key: composer-api-${{ matrix.nextcloud }}-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-api-${{ matrix.nextcloud }}-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress
      - name: API-Check
        run: tools/api-check.sh "${{ matrix.nextcloud }}"

  # Laufzeit-Abhängigkeiten des Bundles gegen bekannte Schwachstellen, bei jedem Lauf statt nur wöchentlich
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --package-lock-only --omit=dev --audit-level=high

  # Die Workflow-Dateien selbst prüfen: Syntax, Ausdrücke, Shell in run-Schritten
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Image per Digest (STANDARDS A2.10); Version und Digest gemeinsam ändern:
      #   docker buildx imagetools inspect rhysd/actionlint:<version>
      - name: actionlint 1.7.12
        run: >-
          docker run --rm -e SHELLCHECK_OPTS='-S warning' -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -oneline -no-color

  # Neue oder geänderte Abhängigkeiten eines Pull Requests gegen die GitHub-Advisory-Datenbank prüfen
  abhaengigkeiten:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Echte Nextcloud mit Kalender-App in Docker, Browser-Tests mit Playwright, je unterstützter Hauptversion
  nextcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - nextcloud: 34.0.5
            kalender: 6.6.3
          - nextcloud: 35.0.2
            kalender: 6.6.4
    env:
      NC_VERSION: ${{ matrix.nextcloud }}
      KALENDER_VERSION: ${{ matrix.kalender }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Chromium aus dem Cache (STANDARDS E2.8): Schlüssel aus Playwright-Version und Runner-System (ImageOS); ohne Treffer
      # Browser und System-Pakete laden, mit Treffer nur die System-Pakete (die liegen nicht im Cache).
      - name: Playwright-Version
        id: playwright
        run: |
          echo "version=$(jq -r '.packages["node_modules/playwright-core"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Chromium für Playwright laden
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - name: System-Pakete für Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - name: Test-Nextcloud starten
        run: tools/test-nextcloud.sh
      - name: Browser-Tests
        run: npm run test:ui
      - name: Nextcloud-Protokoll bei Fehler
        if: failure()
        run: |
          docker exec calplan-nc cat /var/www/html/data/nextcloud.log | tail -50 || true
          docker logs calplan-nc | tail -50 || true
      - name: Paket bauen
        if: matrix.nextcloud == '35.0.2'
        run: tools/paket.sh

  # Ein Pflicht-Check für alle Jobs. Wer einen Branch-Schutz einrichtet, verlangt nur „gate“;
  # die Matrix darf sich dann ändern, ohne den Schutz nachzuziehen. `if: always()` ist nötig,
  # sonst läuft der Job bei einem Fehlschlag gar nicht und der Check bleibt ewig „ausstehend“.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [php, api, npm-audit, actionlint, abhaengigkeiten, nextcloud]
    if: always()
    steps:
      # Jeder Job muss erfolgreich sein. Ausnahme: abhaengigkeiten (dependency-review) läuft nur bei Pull Requests,
      # bei push und workflow_call ist „skipped“ dort richtig. Ohne den Job in `needs` blockierte ein Fund nicht.
      - name: Scheitern, wenn ein Job nicht erfolgreich war
        env:
          ERGEBNIS: ${{ toJSON(needs) }}
          EREIGNIS: ${{ github.event_name }}
        run: |
          echo "$ERGEBNIS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          echo "$ERGEBNIS" | jq -e --arg ereignis "$EREIGNIS" '
            [to_entries[]
             | select(.value.result != "success")
             | select(.key != "abhaengigkeiten" or .value.result != "skipped" or $ereignis == "pull_request")]
            | length == 0' > /dev/null
